{% extends 'layout.html' %}
{% block title %}Contact Me - Bibek Bhattarai{% endblock %}
{% block content %}
<div class="py-16 px-6 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
 
  <div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-8">
    <!-- Contact Form -->
    <div class="flex-1" data-aos="fade-right">
      <form action="{% url 'contact' %}" method="post" 
        class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg transition-colors duration-300">
        {% csrf_token %}
        
        <!-- Added title inside the form with different color -->
        <h3 class="text-2xl font-semibold mb-6 text-purple-600 dark:text-purple-400">Let's Work Together</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label for="firstName" class="block text-gray-700 dark:text-gray-300 text-lg mb-2">First Name</label>
            <input type="text" id="firstName" name="firstName" 
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 
              text-gray-900 dark:text-white rounded-lg shadow-sm focus:outline-none focus:ring-2 
              focus:ring-blue-600 dark:focus:ring-blue-400 transition-colors duration-300" required>
          </div>
          <div>
            <label for="lastName" class="block text-gray-700 dark:text-gray-300 text-lg mb-2">Last Name</label>
            <input type="text" id="lastName" name="lastName" 
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 
              text-gray-900 dark:text-white rounded-lg shadow-sm focus:outline-none focus:ring-2 
              focus:ring-blue-600 dark:focus:ring-blue-400 transition-colors duration-300" required>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label for="email" class="block text-gray-700 dark:text-gray-300 text-lg mb-2">Email</label>
            <input type="email" id="email" name="email" 
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 
              text-gray-900 dark:text-white rounded-lg shadow-sm focus:outline-none focus:ring-2 
              focus:ring-blue-600 dark:focus:ring-blue-400 transition-colors duration-300" required>
          </div>
          <div>
            <label for="phone" class="block text-gray-700 dark:text-gray-300 text-lg mb-2">Phone Number</label>
            <input type="tel" id="phone" name="phone" 
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 
              text-gray-900 dark:text-white rounded-lg shadow-sm focus:outline-none focus:ring-2 
              focus:ring-blue-600 dark:focus:ring-blue-400 transition-colors duration-300" required>
          </div>
        </div>
        <div class="mb-6">
          <label for="message" class="block text-gray-700 dark:text-gray-300 text-lg mb-2">Message</label>
          <textarea id="message" name="message" rows="5" 
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 
            text-gray-900 dark:text-white rounded-lg shadow-sm focus:outline-none focus:ring-2 
            focus:ring-blue-600 dark:focus:ring-blue-400 transition-colors duration-300" 
            placeholder="Type your message here..." required></textarea>
        </div>
        <button type="submit"
          class="w-full bg-blue-600 dark:bg-blue-500 text-white py-3 rounded-lg text-xl hover:bg-blue-700 
          dark:hover:bg-blue-400 transition">
          Send Message
        </button>
      </form>
    </div>


<div class="lg:w-1/3 py-8 px-6" data-aos="fade-left">
  
  <div class="space-y-6 pt-20"> 
    
    <div class="flex items-start">
     
      <div class="w-10 h-10 flex items-center justify-center"> 
        <i class="fas fa-phone text-blue-600 dark:text-blue-400 text-xl"></i> 
      </div>
   
      <div class="ml-4 mt-1"> <!-- Adjusted ml-4 for smaller gap -->
        <p class="text-gray-700 dark:text-gray-300 font-semibold">Phone</p>
        <p class="text-blue-600 dark:text-blue-400">+977 9860425440</p>
      </div>
    </div>

    <!-- Email -->
    <div class="flex items-start">
      <!-- Icon Box -->
      <div class="w-10 h-10 flex items-center justify-center"> <!-- Reduced size to w-10 h-10 -->
        <i class="fas fa-envelope text-blue-600 dark:text-blue-400 text-xl"></i> <!-- Reduced icon size to text-xl -->
      </div>
      <!-- Contact Details -->
      <div class="ml-4 mt-1"> <!-- Adjusted ml-4 for smaller gap -->
        <p class="text-gray-700 dark:text-gray-300 font-semibold">Email</p>
        <p class="text-blue-600 dark:text-blue-400">bbhattarai770@gmail.com</p>
      </div>
    </div>

    <!-- Address -->
    <div class="flex items-start">
      <!-- Icon Box -->
      <div class="w-10 h-10 flex items-center justify-center"> <!-- Reduced size to w-10 h-10 -->
        <i class="fas fa-map-marker-alt text-blue-600 dark:text-blue-400 text-xl"></i> <!-- Reduced icon size to text-xl -->
      </div>
      <!-- Contact Details -->
      <div class="ml-4 mt-1"> <!-- Adjusted ml-4 for smaller gap -->
        <p class="text-gray-700 dark:text-gray-300 font-semibold">Address</p>
        <p class="text-gray-600 dark:text-gray-400">
          Naya Baneshor<br>
          Kathmandu<br>
          Nepal
        </p>
      </div>
    </div>
  </div>
</div>

</div>
{% endblock %}
